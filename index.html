<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Parallax Sidescroller</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "gameUtils": "./js/gameUtils.js",
            "imageProcessor": "./js/imageProcessor.js",
            "sceneGenerator": "./js/sceneGenerator.js"
        }
    }
    </script>
</head>
<body>
    <div id="game-container">
        <div id="background" class="layer">
            <div class="layer-content" id="background-content"></div>
        </div>
        <div id="mid-background" class="layer">
            <div class="layer-content" id="mid-background-content"></div>
        </div>
        <div id="midground" class="layer">
            <div class="layer-content" id="midground-content"></div>
        </div>
        <div id="foreground" class="layer">
            <div class="layer-content" id="foreground-content"></div>
        </div>
        <div id="player">
            <div class="character">
                <!-- Retro pixel art character -->
                <svg viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <rect x="4" y="0" width="8" height="8" fill="#ffccaa"/>
                    <!-- Eyes -->
                    <rect x="6" y="2" width="1" height="1" fill="#000000"/>
                    <rect x="9" y="2" width="1" height="1" fill="#000000"/>
                    <!-- Body -->
                    <rect x="4" y="8" width="8" height="8" fill="#ff0000"/>
                    <!-- Arms -->
                    <rect x="2" y="8" width="2" height="6" fill="#ffccaa"/>
                    <rect x="12" y="8" width="2" height="6" fill="#ffccaa"/>
                    <!-- Legs -->
                    <rect x="4" y="16" width="3" height="8" fill="#0000ff"/>
                    <rect x="9" y="16" width="3" height="8" fill="#0000ff"/>
                </svg>
            </div>
        </div>
        <div id="controls">
            Use A/D or Left/Right arrows to move
        </div>
        <div id="area-transition" class="hidden">
            <div class="transition-text">Entering new area...</div>
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>GENERATING RETRO SCENE...</p>
        <p id="loading-status">PLEASE WAIT...</p>
    </div>

    <canvas id="processCanvas" class="image-canvas"></canvas>

    <script type="module" src="js/game.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
