<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Parallax Sidescroller</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: repeat-x;
            will-change: transform;
            image-rendering: pixelated; /* Makes images look more retro/pixelated */
        }
        
        #background {
            z-index: 1;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #mid-background {
            z-index: 2;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #midground {
            z-index: 3;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #foreground {
            z-index: 4;
            background-position: 0 bottom;
            background-size: auto 100%;
            pointer-events: none;
        }
        
        #player {
            position: absolute;
            left: 45%;
            bottom: 20%;
            width: 40px;
            height: 64px;
            background-color: transparent;
            z-index: 3;
        }

        .character {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            position: relative;
        }

        /* Retro pixel character */
        .character svg {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
            font-family: 'Courier New', monospace; /* Retro font */
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 0; /* Square for retro feel */
            border-top: 5px solid #fff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 0; /* Square for retro feel */
            font-family: 'Courier New', monospace; /* Retro font */
            border: 2px solid #ffffff;
        }

        .image-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background" class="layer"></div>
        <div id="mid-background" class="layer"></div>
        <div id="midground" class="layer"></div>
        <div id="foreground" class="layer"></div>
        <div id="player">
            <div class="character">
                <!-- Retro pixel art character -->
                <svg viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <rect x="4" y="0" width="8" height="8" fill="#ffccaa"/>
                    <!-- Eyes -->
                    <rect x="6" y="2" width="1" height="1" fill="#000000"/>
                    <rect x="9" y="2" width="1" height="1" fill="#000000"/>
                    <!-- Body -->
                    <rect x="4" y="8" width="8" height="8" fill="#ff0000"/>
                    <!-- Arms -->
                    <rect x="2" y="8" width="2" height="6" fill="#ffccaa"/>
                    <rect x="12" y="8" width="2" height="6" fill="#ffccaa"/>
                    <!-- Legs -->
                    <rect x="4" y="16" width="3" height="8" fill="#0000ff"/>
                    <rect x="9" y="16" width="3" height="8" fill="#0000ff"/>
                </svg>
            </div>
        </div>
        <div id="controls">
            Use A/D or Left/Right arrows to move
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>GENERATING RETRO SCENE...</p>
        <p id="loading-status">PLEASE WAIT...</p>
    </div>

    <canvas id="processCanvas" class="image-canvas"></canvas>

    <script>
        // Game variables
        let posX = 0;
        let playerSpeed = 5;
        let keys = {};
        let imageSizes = {
            background: 0,
            midBackground: 0, 
            midground: 0,
            foreground: 0
        };
        
        // Layer speeds (different for parallax effect)
        const layerSpeeds = {
            background: 0.1,
            midBackground: 0.3,
            midground: 0.7,
            foreground: 1.2
        };
        
        // DOM Elements
        const background = document.getElementById('background');
        const midBackground = document.getElementById('mid-background');
        const midground = document.getElementById('midground');
        const foreground = document.getElementById('foreground');
        const player = document.getElementById('player');
        const loading = document.getElementById('loading');
        const loadingStatus = document.getElementById('loading-status');
        const processCanvas = document.getElementById('processCanvas');
        const ctx = processCanvas.getContext('2d');
        
        // Function to process image and make background transparent
        async function processImageTransparency(imageUrl, bgColor = "#FFFFFF", tolerance = 60) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = function() {
                    processCanvas.width = img.width;
                    processCanvas.height = img.height;
                    
                    // Draw the image to canvas
                    ctx.drawImage(img, 0, 0);
                    
                    // Get the image data
                    const imageData = ctx.getImageData(0, 0, processCanvas.width, processCanvas.height);
                    const data = imageData.data;
                    
                    // Parse background color
                    const r1 = parseInt(bgColor.slice(1, 3), 16);
                    const g1 = parseInt(bgColor.slice(3, 5), 16);
                    const b1 = parseInt(bgColor.slice(5, 7), 16);
                    
                    // Replace the background color with transparency
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Calculate color distance using Euclidean distance
                        const distance = Math.sqrt(
                            Math.pow(r - r1, 2) +
                            Math.pow(g - g1, 2) +
                            Math.pow(b - b1, 2)
                        );
                        
                        // If the color is close to the background color, make it transparent
                        if (distance < tolerance) {
                            data[i + 3] = 0; // Alpha channel
                        }
                    }
                    
                    // Put the modified image data back
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Convert canvas to data URL
                    const dataUrl = processCanvas.toDataURL('image/png');
                    resolve(dataUrl);
                };
                
                img.onerror = function() {
                    reject(new Error('Failed to load image'));
                };
                
                img.src = imageUrl;
            });
        }
        
        // Function to get image dimensions
        function getImageDimensions(imageUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    resolve({width: img.width, height: img.height});
                };
                img.onerror = () => {
                    reject(new Error('Failed to load image'));
                };
                img.src = imageUrl;
            });
        }
        
        // Generate images for each layer
        async function generateLayers() {
            try {
                loadingStatus.textContent = "GENERATING BACKGROUND LAYER...";
                const backgroundImg = await websim.imageGen({
                    prompt: "8-bit pixel art retro game background with distant mountains and night sky with stars, low color palette (4-8 colors), perfectly tileable horizontally with matching left and right edges, seamless repeating pattern, NES or SNES style",
                    aspect_ratio: "16:9",
                    seed: 1234, // Using a fixed seed for consistent generation
                });
                
                loadingStatus.textContent = "GENERATING MID-BACKGROUND LAYER...";
                const midBackgroundImg = await websim.imageGen({
                    prompt: "8-bit pixel art retro game mid-background with silhouetted pine trees and rock formations, perfectly tileable horizontally with matching left and right edges, seamless repeating pattern, low color palette (4-8 colors), NES or SNES style",
                    aspect_ratio: "16:9",
                    seed: 2345,
                });
                
                loadingStatus.textContent = "GENERATING MIDGROUND LAYER...";
                const midgroundImg = await websim.imageGen({
                    prompt: "8-bit pixel art retro game midground with platforms, grass and rocks in classic platformer style, perfectly tileable horizontally with matching left and right edges, seamless repeating pattern, clear pixel art style, Super Mario Bros or Mega Man inspired, low color palette (8-16 colors)",
                    aspect_ratio: "16:9",
                    seed: 3456,
                });
                
                loadingStatus.textContent = "GENERATING FOREGROUND LAYER...";
                const foregroundImg = await websim.imageGen({
                    prompt: "8-bit pixel art retro game foreground with decorative vines and hanging elements on pure bright white background (#FFFFFF), only elements at top and sides with empty center area, perfectly tileable horizontally with matching left and right edges, seamless repeating pattern, low color palette (4-8 colors)",
                    aspect_ratio: "16:9",
                    seed: 4567,
                });
                
                // Get image dimensions for proper tiling
                loadingStatus.textContent = "GETTING IMAGE DIMENSIONS...";
                const bgDimensions = await getImageDimensions(backgroundImg.url);
                const midBgDimensions = await getImageDimensions(midBackgroundImg.url);
                const midgroundDimensions = await getImageDimensions(midgroundImg.url);
                const foregroundDimensions = await getImageDimensions(foregroundImg.url);
                
                // Store image widths for proper repeating calculation
                imageSizes.background = bgDimensions.width;
                imageSizes.midBackground = midBgDimensions.width;
                imageSizes.midground = midgroundDimensions.width;
                imageSizes.foreground = foregroundDimensions.width;
                
                loadingStatus.textContent = "PROCESSING TRANSPARENCY...";
                const processedForeground = await processImageTransparency(foregroundImg.url, "#FFFFFF", 100);
                
                // Apply images to layers
                background.style.backgroundImage = `url(${backgroundImg.url})`;
                midBackground.style.backgroundImage = `url(${midBackgroundImg.url})`;
                midground.style.backgroundImage = `url(${midgroundImg.url})`;
                foreground.style.backgroundImage = `url(${processedForeground})`;
                
                // Ensure correct backgrounds settings for proper tiling
                const layers = [background, midBackground, midground, foreground];
                layers.forEach(layer => {
                    layer.style.backgroundRepeat = "repeat-x";
                    layer.style.backgroundSize = "auto 100%";
                });
                
                // Hide loading screen
                loading.style.display = 'none';
                
                // Start game loop
                gameLoop();
            } catch (error) {
                console.error("Error generating images:", error);
                loadingStatus.textContent = "ERROR! PRESS F5 TO RETRY";
            }
        }
        
        // Handle keyboard input
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Game loop
        function gameLoop() {
            // Handle movement - Changed to increment posX when moving right for more intuitive controls
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                posX += playerSpeed;
                player.style.transform = 'scaleX(1)'; // Face right
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                posX -= playerSpeed;
                player.style.transform = 'scaleX(-1)'; // Face left
            }
            
            // Apply parallax effect with proper modulo for repeating backgrounds
            // Use negative positions for correct scrolling direction
            const bgPos = -(posX * layerSpeeds.background) % imageSizes.background;
            const midBgPos = -(posX * layerSpeeds.midBackground) % imageSizes.midBackground;
            const midgroundPos = -(posX * layerSpeeds.midground) % imageSizes.midground;
            const foregroundPos = -(posX * layerSpeeds.foreground) % imageSizes.foreground;
            
            // Apply transforms ensuring backgrounds repeat seamlessly
            background.style.backgroundPosition = `${bgPos}px bottom`;
            midBackground.style.backgroundPosition = `${midBgPos}px bottom`;
            midground.style.backgroundPosition = `${midgroundPos}px bottom`;
            foreground.style.backgroundPosition = `${foregroundPos}px bottom`;
            
            // Continue the loop
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        generateLayers();
    </script>

</body>
