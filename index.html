<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Sidescroller Scene</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #000;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: repeat-x;
            will-change: transform;
        }
        
        #background {
            z-index: 1;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #mid-background {
            z-index: 2;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #midground {
            z-index: 3;
            background-position: 0 bottom;
            background-size: auto 100%;
        }
        
        #foreground {
            z-index: 4;
            background-position: 0 bottom;
            background-size: auto 100%;
            pointer-events: none;
        }
        
        #player {
            position: absolute;
            left: 45%;
            bottom: 20%;
            width: 50px;
            height: 80px;
            background-color: transparent;
            z-index: 3;
        }

        .character {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3498db;
            border-radius: 10px;
            position: relative;
        }

        .character::after {
            content: '';
            position: absolute;
            top: -15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #3498db;
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: white;
        }
        
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #fff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .image-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="background" class="layer"></div>
        <div id="mid-background" class="layer"></div>
        <div id="midground" class="layer"></div>
        <div id="foreground" class="layer"></div>
        <div id="player">
            <div class="character"></div>
        </div>
        <div id="controls">
            Use A/D or Left/Right arrows to move
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Generating scene layers...</p>
        <p id="loading-status">Preparing...</p>
    </div>

    <canvas id="processCanvas" class="image-canvas"></canvas>

    <script>
        // Game variables
        let posX = 0;
        let playerSpeed = 5;
        let keys = {};
        
        // Layer speeds (different for parallax effect)
        const layerSpeeds = {
            background: 0.1,
            midBackground: 0.3,
            midground: 0.7,
            foreground: 1.2
        };
        
        // DOM Elements
        const background = document.getElementById('background');
        const midBackground = document.getElementById('mid-background');
        const midground = document.getElementById('midground');
        const foreground = document.getElementById('foreground');
        const player = document.getElementById('player');
        const loading = document.getElementById('loading');
        const loadingStatus = document.getElementById('loading-status');
        const processCanvas = document.getElementById('processCanvas');
        const ctx = processCanvas.getContext('2d');
        
        // Function to process image and make background transparent
        async function processImageTransparency(imageUrl, bgColor = "#FFFFFF", tolerance = 60) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = function() {
                    processCanvas.width = img.width;
                    processCanvas.height = img.height;
                    
                    // Draw the image to canvas
                    ctx.drawImage(img, 0, 0);
                    
                    // Get the image data
                    const imageData = ctx.getImageData(0, 0, processCanvas.width, processCanvas.height);
                    const data = imageData.data;
                    
                    // Parse background color
                    const r1 = parseInt(bgColor.slice(1, 3), 16);
                    const g1 = parseInt(bgColor.slice(3, 5), 16);
                    const b1 = parseInt(bgColor.slice(5, 7), 16);
                    
                    // Replace the background color with transparency
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Calculate color distance using Euclidean distance
                        const distance = Math.sqrt(
                            Math.pow(r - r1, 2) +
                            Math.pow(g - g1, 2) +
                            Math.pow(b - b1, 2)
                        );
                        
                        // If the color is close to the background color, make it transparent
                        if (distance < tolerance) {
                            data[i + 3] = 0; // Alpha channel
                        }
                    }
                    
                    // Put the modified image data back
                    ctx.putImageData(imageData, 0, 0);
                    
                    // Convert canvas to data URL
                    const dataUrl = processCanvas.toDataURL('image/png');
                    resolve(dataUrl);
                };
                
                img.onerror = function() {
                    reject(new Error('Failed to load image'));
                };
                
                img.src = imageUrl;
            });
        }
        
        // Generate images for each layer
        async function generateLayers() {
            try {
                loadingStatus.textContent = "Generating background layer...";
                const backgroundImg = await websim.imageGen({
                    prompt: "Distant mountains and sky with stars at dusk, low contrast and desaturated colors, side-scrolling game background, peaceful and expansive, solid scene with full coverage",
                    aspect_ratio: "16:9",
                });
                
                loadingStatus.textContent = "Generating mid-background layer...";
                const midBackgroundImg = await websim.imageGen({
                    prompt: "Mid-range scenery with silhouetted pine trees and rock formations, medium distance, side-scrolling game mid-background layer, solid dark shapes against lighter background",
                    aspect_ratio: "16:9",
                });
                
                loadingStatus.textContent = "Generating midground layer...";
                const midgroundImg = await websim.imageGen({
                    prompt: "Detailed terrain with platforms, grass, and rocks in a fantasy style, high contrast, clear pathways for a side-scrolling platformer game, no transparency needed",
                    aspect_ratio: "16:9",
                });
                
                loadingStatus.textContent = "Generating foreground layer...";
                const foregroundImg = await websim.imageGen({
                    prompt: "Decorative vines, branches, and foliage elements with pure bright white background (#FFFFFF) surrounding the elements, foreground elements only at top and sides with large empty white space in center, side-scrolling game foreground overlay",
                    aspect_ratio: "16:9",
                });
                
                loadingStatus.textContent = "Processing foreground transparency...";
                const processedForeground = await processImageTransparency(foregroundImg.url, "#FFFFFF", 100);
                
                // Apply images to layers
                background.style.backgroundImage = `url(${backgroundImg.url})`;
                midBackground.style.backgroundImage = `url(${midBackgroundImg.url})`;
                midground.style.backgroundImage = `url(${midgroundImg.url})`;
                foreground.style.backgroundImage = `url(${processedForeground})`;
                
                // Hide loading screen
                loading.style.display = 'none';
                
                // Start game loop
                gameLoop();
            } catch (error) {
                console.error("Error generating images:", error);
                loadingStatus.textContent = "Error generating images. Please refresh to try again.";
            }
        }
        
        // Handle keyboard input
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Game loop
        function gameLoop() {
            // Handle movement
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                posX -= playerSpeed;
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                posX += playerSpeed;
            }
            
            // Apply parallax effect
            background.style.transform = `translateX(${posX * layerSpeeds.background}px)`;
            midBackground.style.transform = `translateX(${posX * layerSpeeds.midBackground}px)`;
            midground.style.transform = `translateX(${posX * layerSpeeds.midground}px)`;
            foreground.style.transform = `translateX(${posX * layerSpeeds.foreground}px)`;
            
            // Continue the loop
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        generateLayers();
    </script>

</body>
</html>
